acceptance:
- 'Preserve the guiding question: What inputs, observable effects, and failure modes matter when you construct
  a Reliability Block Diagram?'
- The learner flow visibly follows read, baseline, one lever, changed view, and mechanism-first explanation.
- experiment.m has a deterministic baseline, labeled plots and metrics, two independent sweeps, and one
  deliberately broken case.
- model.m separates deterministic calculations from presentation and interactive.m exposes meaningful
  controls.
- lesson and walkthrough connect the module to its prerequisites without syntax-first teaching.
- checks include independent numerical invariants, limiting cases, interpretation questions, and teach-back.
- Manifest status becomes implemented only after focused and repository-wide verification passes.
- Evidence distinguishes static validation from MATLAB runtime, UI, numerical, bench, HIL, and field validation.
validation:
  local:
  - MATLAB_LEARNING_VERIFY_PROFILE=contract python3 scripts/verify.py
  - MATLAB_LEARNING_VERIFY_PROFILE=quick python3 -m unittest discover -s tests -v
  - MATLAB_LEARNING_VERIFY_PROFILE=full ./scripts/agent-verify.sh
  focused_tests_to_add:
  - P07 artifact completeness and manifest identity
  - P07 deterministic model and limiting-case checks
  - P07 two-sweep and broken-case regression
  - P07 placeholder and opaque-black-box regression
  required_ci:
  - Portfolio Control validation
  - target Quality workflow
risk:
  class: moderate
  hazards:
  - wrong units or physical interpretation
  - MATLAB mechanics displace the concept
  - opaque toolbox use
  - unrelated module changes
  - unsupported runtime or physical claims
  stop_conditions:
  - required data or toolbox has no approved transparent fallback
  - changes exceed allowed paths
  - expected result conflicts with the governing model
rollback:
  strategy: Revert P07 implementation changes and restore only its manifest status to scaffolded.
evidence:
  output:
  - docs/evidence/P07-<date>.md
  - validation commands and exit results
  - figure, control, metric, and unit inventory
  - acceptance map, runtime inventory, and limitations
  claim_boundary: Module structure, deterministic contracts, and retained outputs only; no MATLAB-runtime,
    UI, numerical-fidelity, bench, HIL, field, or production validation is implied unless separately retained.
